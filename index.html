<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Result Checker</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: Arial, sans-serif; background: #f3f6fb; color: #172033; }
    main { max-width: 760px; margin: 40px auto; padding: 28px; background: #fff; border-radius: 18px; box-shadow: 0 10px 35px #17203314; }
    h1 { margin: 0 0 8px; font-size: 28px; }
    p { color: #657084; margin-top: 0; }
    .subjects { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 16px; margin: 24px 0; }
    label { display: block; font-weight: 600; font-size: 14px; }
    input { display: block; width: 100%; margin-top: 8px; padding: 12px; border: 1px solid #d8deea; border-radius: 10px; font-size: 16px; }
    button { border: 0; border-radius: 10px; background: #2463eb; color: white; padding: 13px 20px; font-size: 16px; cursor: pointer; }
    button:hover { background: #174fc7; }
    #results { margin-top: 24px; }
    .result { display: flex; justify-content: space-between; gap: 12px; padding: 13px 15px; border: 1px solid #e3e8f1; border-radius: 10px; margin-top: 9px; }
    .grade { font-weight: 700; color: #2463eb; }
    .summary { margin-top: 18px; padding: 16px; border-radius: 12px; background: #eef4ff; font-weight: 700; }
    .error { color: #bd2737; margin-top: 12px; }
  </style>
</head>
<body>
  <main>
    <h1>Student Result Checker</h1>
    <p>Enter marks from 0 to 100 for each subject to see your grade.</p>
    <form id="resultForm">
      <div class="subjects">
        <label>Bangla<input name="Bangla" type="number" min="0" max="100" value="60" required></label>
        <label>English<input name="English" type="number" min="0" max="100" value="60" required></label>
        <label>Math<input name="Math" type="number" min="0" max="100" value="60" required></label>
        <label>Science<input name="Science" type="number" min="0" max="100" value="60" required></label>
        <label>Islam<input name="Islam" type="number" min="0" max="100" value="60" required></label>
      </div>
      <button type="submit">Calculate Results</button>
      <div id="error" class="error" role="alert"></div>
    </form>
    <section id="results" aria-live="polite"></section>
  </main>
  <script src="app.js"></script>
</body>
</html>
