<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Result</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: #f3f6fb;
      color: #172033;
      display: grid;
      place-items: center;
      padding: 24px;
    }
    main {
      width: min(100%, 620px);
      background: white;
      border-radius: 18px;
      padding: 28px;
      box-shadow: 0 12px 35px rgba(25, 45, 80, 0.10);
    }
    h1 { margin-top: 0; text-align: center; }
    p { color: #667085; text-align: center; }
    #results { display: grid; gap: 10px; margin-top: 24px; }
    .result {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding: 14px 16px;
      background: #f7f9fc;
      border: 1px solid #e7ecf3;
      border-radius: 12px;
    }
    .grade { font-weight: 700; color: #18794e; }
  </style>
</head>
<body>
  <main>
    <h1>Student Result</h1>
    <p>Subject-wise grades based on the marks entered in app.js.</p>
    <section id="results" aria-live="polite"></section>
  </main>
  <script src="app.js"></script>
</body>
</html>
